<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #1e110a;
  --choc-deep: #2b1810;
  --choc: #4a2c1a;
  --mid: #7a4a2b;
  --tan: #c8a27a;
  --cream: #f6e8cf;
  --cream-deep: #e9d3a9;
  --orange: #cc5500;
  --orange-hi: #e8742a;
  --orange-lo: #8f3c00;
  --px: 4px;
}

* { box-sizing: border-box; margin: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  font-family: "VT323", "Courier New", monospace;
  font-size: 22px;
  line-height: 1.2;
  color: var(--ink);
  background-color: var(--choc);
  /* pixel checkerboard */
  background-image:
    linear-gradient(45deg, var(--choc-deep) 25%, transparent 25%, transparent 75%, var(--choc-deep) 75%),
    linear-gradient(45deg, var(--choc-deep) 25%, transparent 25%, transparent 75%, var(--choc-deep) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 8px 8px;
}

/* ---------- card ---------- */
.card {
  width: 100%;
  max-width: 460px;
  padding: 24px 20px 28px;
  display: grid;
  gap: 16px;
  background: var(--cream);
  /* stepped pixel border + hard drop shadow */
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    12px 12px 0 0 var(--choc-deep);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

h1 {
  font-family: "Press Start 2P", monospace;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.4;
  color: var(--choc);
}

/* ---------- buttons & input ---------- */
.unit-toggle { display: flex; gap: 8px; }

.unit, .btn {
  font-family: "Press Start 2P", monospace;
  font-size: 11px;
  cursor: pointer;
  border: 0;
  padding: 12px 14px;
  color: var(--cream);
  background: var(--orange);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--orange-hi),
    inset -4px -4px 0 0 var(--orange-lo);
}

.unit {
  padding: 8px 10px;
  color: var(--choc);
  background: var(--cream-deep);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset -4px -4px 0 0 var(--tan);
}
.unit.active {
  color: var(--cream);
  background: var(--choc);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--ink);
}

.btn:hover { background: var(--orange-hi); }
.btn:active {
  transform: translate(2px, 2px);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--orange-lo);
}

.btn-alt {
  justify-self: start;
  color: var(--choc);
  background: var(--cream-deep);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset -4px -4px 0 0 var(--tan);
}
.btn-alt:hover { background: #f1dfb9; }
.btn-alt:active {
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--tan);
}

.search { display: flex; gap: 12px; }

input {
  flex: 1;
  min-width: 0;
  font-family: "VT323", monospace;
  font-size: 26px;
  padding: 8px 12px;
  color: var(--ink);
  background: #fff8e8;
  border: 0;
  border-radius: 0;
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--cream-deep);
}
input::placeholder { color: var(--mid); opacity: 0.7; }

button:focus-visible, input:focus-visible {
  outline: 4px dashed var(--orange);
  outline-offset: 6px;
}

/* ---------- status line ---------- */
.status {
  min-height: 28px;
  font-size: 24px;
  color: var(--choc);
}
.status.error { color: var(--orange-lo); }
.status.loading::after {
  content: "_";
  animation: blink 0.8s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- result ---------- */
.result { display: grid; gap: 16px; }
.result[hidden] { display: none; }

.screen {
  padding: 20px 16px 18px;
  display: grid;
  gap: 18px;
  color: var(--cream);
  background-color: var(--choc-deep);
  /* faint scanlines */
  background-image: repeating-linear-gradient(
    0deg, rgba(246, 232, 207, 0.04) 0 2px, transparent 2px 4px);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    inset 0 0 0 4px var(--mid);
}

.hero {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 4px 8px 0;
}

#sprite {
  width: 120px;
  height: 120px;
  image-rendering: pixelated;
  animation: bob 1.6s steps(2) infinite;
}
@keyframes bob { 50% { transform: translateY(-6px); } }

.temp {
  font-family: "Press Start 2P", monospace;
  font-size: 44px;
  line-height: 1.1;
  color: var(--cream);
}
.deg { color: var(--orange-hi); margin-left: 4px; }

.condition {
  margin-top: 10px;
  font-size: 28px;
  color: var(--tan);
}

.gauge { display: flex; gap: 4px; padding: 0 8px; }
.gauge span {
  flex: 1;
  height: 14px;
  background: var(--choc);
}
.gauge span.on { background: var(--orange); box-shadow: inset 0 4px 0 0 var(--orange-hi); }

.place { padding: 0 4px; }
.place-name {
  font-family: "Press Start 2P", monospace;
  font-size: 13px;
  line-height: 1.6;
  color: var(--choc);
}
.place-time { margin-top: 4px; font-size: 24px; color: var(--mid); }

.stats {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.stats li {
  padding: 10px 12px;
  display: grid;
  gap: 4px;
  background: var(--cream-deep);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--choc),
    0 var(--px) 0 0 var(--choc),
    calc(var(--px) * -1) 0 0 0 var(--choc),
    var(--px) 0 0 0 var(--choc);
}
.stats .wide { grid-column: 1 / -1; }
.label { font-size: 20px; color: var(--mid); }
.value {
  font-family: "Press Start 2P", monospace;
  font-size: 13px;
  line-height: 1.5;
  color: var(--choc);
}

@media (max-width: 380px) {
  .temp { font-size: 34px; }
  #sprite { width: 96px; height: 96px; }
}

@media (prefers-reduced-motion: reduce) {
  #sprite, .status.loading::after { animation: none; }
}

</style>
</head>
<body>
  <main class="card">
    <header class="top">
      <h1>Pixel Weather</h1>
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" id="btnC" class="unit active" aria-pressed="true">°C</button>
        <button type="button" id="btnF" class="unit" aria-pressed="false">°F</button>
      </div>
    </header>

    <form id="searchForm" class="search" autocomplete="off">
      <label for="cityInput" class="sr-only">City name</label>
      <input id="cityInput" type="text" placeholder="Try London" required>
      <button type="submit" class="btn">Search</button>
    </form>
    <button type="button" id="locateBtn" class="btn btn-alt">Use my location</button>

    <p id="status" class="status" role="status" aria-live="polite">Type a city above to see today’s weather.</p>

    <section id="result" class="result" aria-live="polite" hidden>
      <div class="screen">
        <div class="hero">
          <canvas id="sprite" width="12" height="12" aria-hidden="true"></canvas>
          <div class="temp-block">
            <p class="temp"><span id="temp">--</span><span id="unitLabel" class="deg">°C</span></p>
            <p id="condition" class="condition">--</p>
          </div>
        </div>
        <div id="gauge" class="gauge" aria-hidden="true"></div>
      </div>

      <div class="place">
        <p id="place" class="place-name">--</p>
        <p id="time" class="place-time">--</p>
      </div>

      <ul class="stats">
        <li><span class="label">Feels like</span><span id="feels" class="value">--</span></li>
        <li><span class="label">Humidity</span><span id="humidity" class="value">--</span></li>
        <li><span class="label">Wind</span><span id="wind" class="value">--</span></li>
        <li><span class="label">UV index</span><span id="uv" class="value">--</span></li>
        <li class="wide"><span class="label">Air quality</span><span id="aqi" class="value">--</span></li>
      </ul>
    </section>
  </main>

  <script>
(() => {
  "use strict";

  // ---------- config ----------
  const CONFIG = {
    API_KEY: "765b99ee37a94ebda6494153262610",
    ENDPOINT: "https://api.weatherapi.com/v1/current.json", // https avoids mixed-content errors on secure sites
  };

  // ---------- pixel sprites (12 x 12, one letter = one colour) ----------
  const PALETTE = {
    R: "#f6e8cf", // sun rays
    O: "#cc5500", // sun body, moon stars
    W: "#f6e8cf", // cloud
    S: "#c8a27a", // cloud shadow
    D: "#e8742a", // rain drops
    N: "#f6e8cf", // snow
    B: "#e8742a", // lightning
    F: "#c8a27a", // fog
    C: "#f6e8cf", // moon
  };

  const SUN = [
    ".....RR.....",
    ".R...RR...R.",
    "..R......R..",
    "....OOOO....",
    "...OOOOOO...",
    "RR.OOOOOO.RR",
    "RR.OOOOOO.RR",
    "...OOOOOO...",
    "....OOOO....",
    "..R......R..",
    ".R...RR...R.",
    ".....RR.....",
  ];

  const MOON = [
    "....CCCC....",
    "..CCCC......",
    ".CCCC.......",
    ".CCC........",
    "CCCC.....O..",
    "CCCC........",
    "CCCC........",
    "CCCC........",
    ".CCCC.......",
    ".CCCCC...O..",
    "..CCCCCCC...",
    "....CCCC....",
  ];

  const CLOUD = [
    "....WWW.....",
    "...WWWWW....",
    "..WWWWWWWWW.",
    ".WWWWWWWWWWW",
    "WWWWWWWWWWWW",
    "WWWWWWWWWWWW",
    ".SSSSSSSSSS.",
  ];

  const RAIN = [
    ".D..D..D....",
    "..D..D..D...",
    ".D..D..D....",
    "..D..D..D...",
    ".D..D..D....",
  ];

  const SNOW = [
    ".N...N...N..",
    "...N...N....",
    ".N...N...N..",
    "...N...N....",
    ".N...N...N..",
  ];

  const THUNDER = [
    ".....BB.....",
    "....BB......",
    "...BBBBB....",
    ".....BB.....",
    "....B.......",
  ];

  const FOG = [
    "............",
    "............",
    "............",
    ".FFFFFFFFFF.",
    "............",
    "..FFFFFFFFFF",
    "............",
    ".FFFFFFFFFF.",
    "............",
    "FFFFFFFFFF..",
    "............",
    "............",
  ];

  // paste `top` onto `base`, shifted down by dy rows (transparent "." pixels are skipped)
  const overlay = (base, top, dy) => {
    const grid = base.map((row) => row.split(""));
    top.forEach((row, y) => {
      row.split("").forEach((ch, x) => {
        if (ch !== "." && grid[y + dy]) grid[y + dy][x] = ch;
      });
    });
    return grid.map((row) => row.join(""));
  };

  const SPRITES = {
    sun: SUN,
    moon: MOON,
    partlyDay: overlay(SUN, CLOUD, 5),
    partlyNight: overlay(MOON, CLOUD, 5),
    cloud: [...CLOUD, ...Array(5).fill("............")],
    rain: [...CLOUD, ...RAIN],
    snow: [...CLOUD, ...SNOW],
    thunder: [...CLOUD, ...THUNDER],
    fog: FOG,
  };

  // WeatherAPI condition codes -> sprite
  const CODES = {
    thunder: [1087, 1273, 1276, 1279, 1282],
    fog: [1030, 1135, 1147],
    snow: [1066, 1069, 1072, 1114, 1117, 1204, 1207, 1210, 1213, 1216, 1219, 1222, 1225, 1237, 1255, 1258, 1261, 1264],
    rain: [1063, 1150, 1153, 1168, 1171, 1180, 1183, 1186, 1189, 1192, 1195, 1198, 1201, 1240, 1243, 1246, 1249, 1252],
  };

  const pickSprite = (code, isDay) => {
    if (CODES.thunder.includes(code)) return SPRITES.thunder;
    if (CODES.fog.includes(code)) return SPRITES.fog;
    if (CODES.snow.includes(code)) return SPRITES.snow;
    if (CODES.rain.includes(code)) return SPRITES.rain;
    if (code === 1000) return isDay ? SPRITES.sun : SPRITES.moon;
    if (code === 1003) return isDay ? SPRITES.partlyDay : SPRITES.partlyNight;
    return SPRITES.cloud;
  };

  // ---------- elements & state ----------
  const $ = (id) => document.getElementById(id);
  const el = {
    form: $("searchForm"),
    input: $("cityInput"),
    locate: $("locateBtn"),
    btnC: $("btnC"),
    btnF: $("btnF"),
    status: $("status"),
    result: $("result"),
    canvas: $("sprite"),
    temp: $("temp"),
    unitLabel: $("unitLabel"),
    condition: $("condition"),
    gauge: $("gauge"),
    place: $("place"),
    time: $("time"),
    feels: $("feels"),
    humidity: $("humidity"),
    wind: $("wind"),
    uv: $("uv"),
    aqi: $("aqi"),
  };

  const AQI_LABELS = ["Good", "Moderate", "Unhealthy for some", "Unhealthy", "Very unhealthy", "Hazardous"];
  const GAUGE_SEGMENTS = 10;

  let unit = "c";
  let lastData = null;
  let requestId = 0;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- drawing ----------
  const drawSprite = (rows) => {
    const ctx = el.canvas.getContext("2d");
    ctx.clearRect(0, 0, 12, 12);
    rows.forEach((row, y) => {
      row.split("").forEach((ch, x) => {
        if (PALETTE[ch]) {
          ctx.fillStyle = PALETTE[ch];
          ctx.fillRect(x, y, 1, 1);
        }
      });
    });
  };

  const drawGauge = (tempC) => {
    // maps -10°C ... 45°C onto 10 pixel segments
    const filled = Math.max(0, Math.min(GAUGE_SEGMENTS, Math.round(((tempC + 10) / 55) * GAUGE_SEGMENTS)));
    el.gauge.innerHTML = "";
    for (let i = 0; i < GAUGE_SEGMENTS; i++) {
      const seg = document.createElement("span");
      if (i < filled) seg.className = "on";
      el.gauge.appendChild(seg);
    }
  };

  const setStatus = (message, type) => {
    el.status.textContent = message;
    el.status.className = "status" + (type ? " " + type : "");
  };

  const render = (data) => {
    const { location: loc, current: cur } = data;
    const isC = unit === "c";

    drawSprite(pickSprite(cur.condition.code, cur.is_day === 1));
    drawGauge(cur.temp_c);

    el.temp.textContent = Math.round(isC ? cur.temp_c : cur.temp_f);
    el.unitLabel.textContent = isC ? "°C" : "°F";
    el.condition.textContent = cur.condition.text;

    el.place.textContent = [loc.name, loc.region, loc.country].filter(Boolean).join(", ");
    el.time.textContent = "Local time " + loc.localtime;

    el.feels.textContent = Math.round(isC ? cur.feelslike_c : cur.feelslike_f) + (isC ? "°C" : "°F");
    el.humidity.textContent = cur.humidity + "%";
    el.wind.textContent = isC ? Math.round(cur.wind_kph) + " km/h" : Math.round(cur.wind_mph) + " mph";
    el.uv.textContent = cur.uv;

    const epa = cur.air_quality && cur.air_quality["us-epa-index"];
    el.aqi.textContent = epa ? AQI_LABELS[epa - 1] : "Not available";

    el.result.hidden = false;
    setStatus("");
  };

  // ---------- data ----------
  const fetchWeather = async (query) => {
    const id = ++requestId;
    el.result.hidden = true;
    setStatus("Loading", "loading");

    try {
      const url = `${CONFIG.ENDPOINT}?key=${CONFIG.API_KEY}&q=${encodeURIComponent(query)}&aqi=yes`;
      const res = await fetch(url);
      const data = await res.json();
      if (id !== requestId) return; // a newer search replaced this one

      if (!res.ok || data.error) {
        const code = data.error && data.error.code;
        if (code === 1006) {
          setStatus("Couldn’t find that place. Check the spelling or add the country.", "error");
        } else if (data.error && data.error.message) {
          setStatus("API error " + code + ": " + data.error.message, "error");
        } else {
          setStatus("Something went wrong (HTTP " + res.status + "). Try again in a moment.", "error");
        }
        console.error("WeatherAPI response:", data);
        return;
      }

      lastData = data;
      store.set("pw-last-query", query);
      render(data);
    } catch (err) {
      if (id !== requestId) return;
      setStatus("Can’t reach the weather service. Check your connection.", "error");
    }
  };

  // ---------- interactions ----------
  const setUnit = (next) => {
    unit = next;
    store.set("pw-unit", next);
    el.btnC.classList.toggle("active", next === "c");
    el.btnF.classList.toggle("active", next === "f");
    el.btnC.setAttribute("aria-pressed", String(next === "c"));
    el.btnF.setAttribute("aria-pressed", String(next === "f"));
    if (lastData) render(lastData);
  };

  el.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = el.input.value.trim();
    if (q) fetchWeather(q);
  });

  el.btnC.addEventListener("click", () => setUnit("c"));
  el.btnF.addEventListener("click", () => setUnit("f"));

  el.locate.addEventListener("click", () => {
    if (!navigator.geolocation) {
      setStatus("This browser can’t share your location. Type a city instead.", "error");
      return;
    }
    setStatus("Finding you", "loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(4);
        const lon = pos.coords.longitude.toFixed(4);
        el.input.value = "";
        fetchWeather(`${lat},${lon}`);
      },
      () => setStatus("Location access was blocked. Type a city instead.", "error"),
      { timeout: 10000 }
    );
  });

  // ---------- start ----------
  setUnit(store.get("pw-unit") === "f" ? "f" : "c");
  const last = store.get("pw-last-query");
  if (last && !/^-?\d/.test(last)) {
    el.input.value = last;
    fetchWeather(last);
  }
})();

</script>
</body>
</html>
